name: campus
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: campus, POSTGRES_PASSWORD: campus, POSTGRES_DB: campus }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run migrate
      - run: npm test
        env: {DATABASE_URL: "postgres://campus:campus@127.0.0.1:5432/campus", REDIS_URL: "redis://127.0.0.1:6379"}
      - run: npm run test:storage
      - run: npm run check:places
      - run: npm run build
