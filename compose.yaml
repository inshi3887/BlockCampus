services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: campus, POSTGRES_PASSWORD: campus, POSTGRES_DB: campus }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  seaweedfs:
    image: m.daocloud.io/docker.io/chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0", "-admin.port.legacy=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-campus}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-campus-local-secret}
      WEED_ADMIN_USER: ${SEAWEED_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${SEAWEED_ADMIN_PASSWORD:-campus-admin-local-secret}
    ports: ["127.0.0.1:9000:8333", "127.0.0.1:9001:12535"]
    volumes: ["seaweed_objects:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
volumes:
  pgdata:
  seaweed_objects:
